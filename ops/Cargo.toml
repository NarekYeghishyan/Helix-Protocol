[package]
name = "helix-ops"
description = "Deployment planning for Helix: the atomic bootstrap, and what it will do."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true, features = ["token_2022"] }

helix-staking = { path = "../programs/staking", features = ["no-entrypoint"] }
helix-governance = { path = "../programs/governance", features = ["no-entrypoint"] }
helix-treasury = { path = "../programs/treasury", features = ["no-entrypoint"] }

# Versions matched to what anchor-lang 1.1.2 already resolves, so no duplicate
# solana crates enter the graph.
solana-instruction = "3.2.0"
# `serde` so the planned transaction can be measured with bincode; the size
# against the 1232-byte packet limit is what F-1's mitigation depends on.
solana-transaction = { version = "3.1.0", features = ["serde"] }
bincode = "1.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Deliberately absent: an RPC client.
#
# `solana-rpc-client` is at 4.2.0-rc while this workspace resolves the Solana
# crates at 3.x, and the graph already carries eight duplicated solana-* crates.
# Adding a second major version of the SDK to submit one transaction is the same
# trade that ruled out Trident, and it would buy code that cannot be tested here
# anyway. This crate plans and verifies; submitting is one documented step with
# whatever client the operator already has. See `docs/RUNBOOK.md`.
