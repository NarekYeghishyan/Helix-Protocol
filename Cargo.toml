[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NarekYeghishyan/Helix-Protocol"
authors = ["Narek Yeghishyan"]

[workspace.dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"

# Local program crates, depended on for CPI (feature = "cpi") and shared types.
# Added here as each program starts being consumed by another.
helix-token-manager = { path = "programs/token-manager", features = ["cpi"] }
helix-staking = { path = "programs/staking", features = ["cpi"] }
helix-treasury = { path = "programs/treasury", features = ["cpi"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
