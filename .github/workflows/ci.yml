name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  ANCHOR_VERSION: "1.1.2"
  SOLANA_VERSION: "stable"

jobs:
  # Fast feedback: formatting and lints fail in under a minute, before anything
  # spends 15 minutes building BPF bytecode.
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Documentation is a deliverable here, and a link that resolves to nothing
      # is the quiet way it stops being trustworthy. Sixteen anchors were broken
      # for several commits without anything noticing.
      - name: Documentation links
        run: python3 scripts/check-doc-links.py

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `--ignore-scripts`: a transitive package's postinstall shells out to
      # `yarn`, which nothing here depends on. `ci` rather than `install`, so a
      # drifted lockfile fails instead of being silently rewritten.
      - run: npm ci --ignore-scripts

      # Node's built-in runner over TypeScript directly — no test framework and
      # no build step, which is why this runs before the compile.
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Build & test programs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # BPF artifacts land outside the default target dir.
          cache-directories: |
            ~/.cache/solana
            ~/.local/share/solana

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Anchor binary
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.avm
          key: avm-${{ env.ANCHOR_VERSION }}-${{ runner.os }}

      - name: Install Anchor
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        # Install avm from the Anchor repository, not from crates.io. The crates.io
        # name `avm` belongs to an unrelated, abandoned 2015 crate that fails to
        # build against modern OpenSSL — `cargo install --locked avm` looks correct
        # and installs the wrong thing.
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --locked --force
          avm install "$ANCHOR_VERSION"

      - name: Select Anchor version
        run: |
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          avm use "$ANCHOR_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deliberately dependency-free — it uses only `node:crypto`, so there is
      # nothing to install before it runs.
      - name: Generate program keypairs
        run: node scripts/gen-program-keys.mjs

      - name: Verify declared program IDs match keypairs
        run: anchor keys verify || (echo "::error::declare_id! does not match target/deploy keypairs — run 'anchor keys sync'" && exit 1)

      - name: Build programs and fail on SBF stack overflow
        # `anchor build` reports "Stack offset of N exceeded max offset of 4096"
        # as an error and then exits 0 regardless, shipping a program that may
        # corrupt memory at runtime. The exit code cannot be trusted here.
        run: |
          set -o pipefail
          anchor build 2>&1 | tee build.log
          if grep -iE "stack offset|exceeded max offset" build.log; then
            echo "::error::SBF stack frame overflow — Box the large accounts in the reported Accounts struct"
            exit 1
          fi

      # The full suite, not `--lib`. `--lib` silently skips doctests, and the
      # program READMEs are pulled in with `#![doc = include_str!(..)]` — so a
      # broken code fence in a README is a real compile failure that `--lib`
      # hides. It also picks up the runtime tests under tests/integration, which
      # load the .so files the previous step just built, and the compute
      # benchmarks that assert every instruction stays inside its budget.
      - name: Rust tests (unit + doc + runtime)
        run: cargo test --workspace

      # The read API's HTTP transport and the RPC source are behind features, so
      # `--workspace` alone never compiles either. Targeted rather than a
      # workspace-wide `--all-features`, which would also switch on Anchor's
      # `idl-build` and break the program crates.
      #
      # The six live tests in `rpc_source_live.rs` skip here: they need
      # HELIX_RPC_URL pointing at a validator, and CI has none. They are run
      # against `solana-test-validator` locally — see docs/TESTING.md. Skipping
      # is reported by the test itself rather than by an `#[ignore]`, so the
      # reason is in the output rather than in a flag someone has to know about.
      - name: Read API transport and RPC source
        run: cargo test -p helix-indexer --features server,rpc

      # `anchor test` is deliberately not run. The runtime suite is Rust against
      # LiteSVM, executed by the step above; there is no TypeScript suite, and
      # stubbing one green would report a passing integration run containing
      # nothing.

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: programs
          path: |
            target/deploy/*.so
            target/idl/*.json
          retention-days: 14
          if-no-files-found: warn
