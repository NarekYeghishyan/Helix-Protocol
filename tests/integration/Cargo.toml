[package]
name = "helix-integration-tests"
description = "Runtime tests for the Helix programs, executed against LiteSVM."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A test-only crate, not a program. It lives outside `programs/` so `anchor build`
# never treats it as one, and it depends on all four programs with `no-entrypoint`
# so their entrypoint symbols do not collide in one binary.

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true, features = ["token_2022", "token_2022_extensions"] }

helix-token-manager = { path = "../../programs/token-manager", features = ["no-entrypoint"] }
helix-staking = { path = "../../programs/staking", features = ["no-entrypoint"] }
helix-governance = { path = "../../programs/governance", features = ["no-entrypoint"] }
helix-treasury = { path = "../../programs/treasury", features = ["no-entrypoint"] }

# The indexer is verified here rather than in its own crate: proving it agrees
# with the chain needs a chain, and this is where one is. `rpc` is on because
# the live tests read a real validator through the very source a deployment
# would use, rather than through a second client written for the test.
helix-indexer = { path = "../../indexer", features = ["rpc"] }

# Likewise the deployment plan: `bootstrap_atomicity.rs` executes the very
# instructions `helix-bootstrap` emits, so the plan an operator reads is the plan
# the suite has run.
helix-ops = { path = "../../ops" }

# Pinned deliberately. litesvm 0.14+ tracks a newer Solana than anchor-lang 1.1.2
# does, which puts two versions of `wincode` in the graph and breaks the sysvar
# traits with an error that reads like a bug in litesvm rather than a version
# mismatch:
#
#   the trait bound `Rent: SchemaRead<..>` is not satisfied
#   note: there are multiple different versions of crate `wincode`
#
# Re-check this pin whenever anchor-lang moves. A normal dependency rather than a
# dev-dependency because the shared fixtures in `src/` use it.
litesvm = "=0.13.1"

# Versions match what anchor-lang 1.1.2 already resolves, so no duplicate solana
# crates enter the graph.
solana-keypair = "3.1.2"
solana-signer = "3.0.0"
solana-transaction = "3.1.0"
solana-instruction = "3.2.0"
solana-system-interface = "3.1.0"
solana-native-token = "3.0.0"
# Transaction size measurement in bootstrap_atomicity.rs, and the wire form the
# live tests hand to `sendTransaction`.
bincode = "1.3"

# `cluster.rs` only. Matches the indexer's client so one TLS stack is built, not
# two.
ureq = { version = "3", features = ["json"] }
serde_json = "1"
base64 = "0.22"
