[package]
name = "helix-indexer"
description = "Reconstructs Helix protocol state from the event log the programs emit."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anchor-lang = { workspace = true }

# The programs themselves, for their event types and their arithmetic.
#
# This is the whole reason the indexer is written in Rust. A separate client
# re-declares the event schema and re-implements any derived figure, and the two
# copies drift the first time a program changes — silently, because nothing
# compares them. Here the event structs *are* the program's structs, the weight
# table *is* the program's weight table, and a schema change that the indexer has
# not accounted for is a compile error.
helix-token-manager = { path = "../programs/token-manager", features = ["no-entrypoint"] }
helix-staking = { path = "../programs/staking", features = ["no-entrypoint"] }
helix-governance = { path = "../programs/governance", features = ["no-entrypoint"] }
helix-treasury = { path = "../programs/treasury", features = ["no-entrypoint"] }

# Anchor writes event payloads as base64 on `Program data:` lines.
base64 = "0.22"

# Already in the graph via anchor-lang, so this adds nothing new.
serde = { version = "1", features = ["derive"] }

# The HTTP transport is optional. The read model in `api.rs` is pure and always
# compiled; only the wiring in `server.rs` needs a runtime, and keeping it behind
# a feature means `cargo test --workspace` does not pay for tokio to test logic
# that has no I/O in it. CI lints with `--all-features`, so the server is still
# checked.
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = []
server = ["dep:axum", "dep:tokio"]

# Cargo builds every `src/bin/*.rs` by default, so without this the binary is
# compiled even when the feature that supplies its dependencies is off.
[[bin]]
name = "helix-api"
required-features = ["server"]
