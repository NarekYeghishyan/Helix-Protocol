[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

# Program IDs for helix_governance and helix_treasury are reserved in
# target/deploy (see scripts/gen-program-keys.mjs) and are added here as each
# program lands, so that `anchor build` and `anchor deploy` only ever reference
# programs that actually exist.
[programs.localnet]
helix_token_manager = "5RU35Eni3MxkuSc9Zv5xm8LLd2QX85XdbYjRUaLkFRFr"
helix_staking = "9RuZJZpgCwbiF9JRAsyR8cqDhFSaFYus1mzobKzEZzP3"

[programs.devnet]
helix_token_manager = "5RU35Eni3MxkuSc9Zv5xm8LLd2QX85XdbYjRUaLkFRFr"
helix_staking = "9RuZJZpgCwbiF9JRAsyR8cqDhFSaFYus1mzobKzEZzP3"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.spec.ts"
